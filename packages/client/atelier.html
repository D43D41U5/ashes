<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASHES — l'Atelier des plans</title>
    <style>
      /* L'Atelier est un OUTIL DE DEV (spec atelier-plans.md A5) : il vit à côté du banc
         d'écoute, servi par `pnpm dev` seulement — le build de prod ne le connaît pas.
         LE LAYOUT EST L'ÉTABLI (décision d'Alexis) : barre d'outils, gauche (lieux +
         palette), viewport, inspecteur, barre d'état — tout visible, rien de modal. */
      html, body { margin: 0; padding: 0; background: #14110d; color: #d8d2c6; font: 13px/1.45 ui-monospace, monospace; height: 100%; }
      #app { display: grid; height: 100vh; box-sizing: border-box;
        grid-template-columns: 300px 1fr 252px;
        grid-template-rows: auto 1fr auto auto;
        grid-template-areas: "tb tb tb" "gauche centre droite" "aide aide aide" "sb sb sb"; }
      /* LA BANDE D'AIDE (demande d'Alexis) : ce qui est sous la main, expliqué en continu —
         l'outil actif par défaut, le contrôle ou la pièce survolés sinon. */
      #aide { grid-area: aide; padding: 5px 14px; background: #191510; border-top: 1px solid #2e2820; color: #b8a888; font-size: 12px; min-height: 17px; }
      #aide-panneau { position: fixed; inset: 8% 18%; z-index: 10; overflow-y: auto; background: #1b1712; border: 1px solid #6a5426; border-radius: 8px; padding: 18px 26px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); cursor: pointer; }
      #aide-panneau h3 { color: #e8b34a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 14px 0 4px; }
      #aide-panneau h3:first-child { margin-top: 0; }
      #aide-panneau p { margin: 3px 0; color: #d8d2c6; max-width: 90ch; }
      #toolbar { grid-area: tb; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 12px; background: #1b1712; border-bottom: 1px solid #2e2820; }
      #gauche { grid-area: gauche; padding: 10px 14px; background: #1b1712; border-right: 1px solid #2e2820; overflow-y: auto; }
      #centre { grid-area: centre; display: grid; place-items: center; overflow: auto; padding: 10px; }
      #droite { grid-area: droite; padding: 10px 14px; background: #1b1712; border-left: 1px solid #2e2820; overflow-y: auto; }
      #statusbar { grid-area: sb; display: flex; gap: 18px; align-items: center; padding: 5px 14px; background: #1b1712; border-top: 1px solid #2e2820; color: #948a76; font-size: 12px; min-height: 18px; }
      #statusbar .ok { color: #7aa35a; } #statusbar .faute { color: #e06c5a; }

      h1 { font-size: 14px; margin: 0 8px 0 0; color: #e8b34a; }
      h2 { font-size: 11px; margin: 12px 0 6px; color: #b8a888; text-transform: uppercase; letter-spacing: 0.06em; }
      h2:first-child { margin-top: 0; }
      select, input[type="number"], button { background: #241f18; color: #d8d2c6; border: 1px solid #3a3226; border-radius: 3px; padding: 3px 6px; font: inherit; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.principal { background: #4a3a1a; border-color: #6a5426; color: #f0d9a0; padding: 6px 12px; }
      label { display: inline-flex; align-items: center; gap: 5px; }
      kbd { font-size: 10px; color: #948a76; border: 1px dashed #3a3226; border-radius: 3px; padding: 0 4px; }
      .sep { width: 1px; align-self: stretch; background: #2e2820; margin: 0 2px; }

      #toolbar .outil-groupe { display: flex; gap: 2px; }
      #toolbar .outil-groupe label { border: 1px solid #3a3226; border-radius: 3px; padding: 3px 8px; cursor: pointer; background: #201c15; }
      #toolbar .outil-groupe label:has(input:checked) { border-color: #e8b34a; color: #e8b34a; }
      #toolbar .outil-groupe input { display: none; }
      #toolbar .calques label { margin-right: 8px; color: #b8a888; }

      #jeu { border: 1px solid #2e2820; cursor: crosshair; line-height: 0; }
      #jeu canvas { display: block; }

      #palette .cat-titre { font-size: 10px; color: #948a76; text-transform: uppercase; letter-spacing: 0.06em; margin: 8px 0 4px; }
      #palette .cat-titre:first-child { margin-top: 0; }
      #palette .cat-rangee { display: flex; flex-wrap: wrap; gap: 4px; }
      /* L'INFOBULLE du picker : immédiate au survol, près du curseur — le title natif est
         lent et se rate ; la bande du bas reste l'écho persistant. */
      #infobulle { position: fixed; z-index: 20; display: none; max-width: 330px; background: #241f18; border: 1px solid #6a5426; border-radius: 4px; padding: 7px 10px; font-size: 11.5px; line-height: 1.45; color: #d8d2c6; box-shadow: 0 6px 18px rgba(0,0,0,0.5); pointer-events: none; }
      #infobulle b { color: #e8b34a; }
      #palette .tuile { width: 44px; padding: 3px 0 2px; text-align: center; border: 1px solid #3a3226; border-radius: 3px; cursor: pointer; background: #201c15; position: relative; }
      #palette .tuile.actif { border-color: #e8b34a; background: #2c2416; }
      #palette canvas { image-rendering: pixelated; display: block; margin: 0 auto 1px; }
      #palette .car { color: #e8b34a; }
      #palette .nom { font-size: 9px; color: #948a76; display: block; }
      #palette .kbd { position: absolute; top: 1px; right: 2px; font-size: 9px; color: #948a76; }
      #validation .faute { color: #e06c5a; }
      #validation .ok { color: #7aa35a; }
      #validation .note { color: #948a76; }
      .rangee { margin: 5px 0; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
      #etat { font-size: 11px; color: #948a76; min-height: 28px; margin-top: 8px; }
      .redim { color: #948a76; margin-right: 4px; }
      .redim button { padding: 1px 5px; }
      #tampons .tampon { display: inline-flex; align-items: center; gap: 4px; border: 1px solid #3a3226; border-radius: 3px; padding: 2px 6px; margin: 2px 3px 2px 0; cursor: pointer; background: #201c15; }
      #tampons .tampon .x { color: #948a76; cursor: pointer; }
      #tampons .tampon .x:hover { color: #e06c5a; }
      #planche { display: flex; flex-wrap: wrap; gap: 4px; }
      #planche figure { margin: 0; text-align: center; cursor: pointer; }
      #planche img { width: 104px; height: 104px; image-rendering: pixelated; border: 1px solid #3a3226; border-radius: 3px; display: block; }
      #planche figcaption { font-size: 9px; color: #948a76; }
      #historique div { font-size: 11px; color: #948a76; margin: 2px 0; cursor: pointer; }
      #historique div:hover { color: #d8d2c6; }
      #diff { background: #14110d; border: 1px solid #2e2820; border-radius: 3px; padding: 8px; font-size: 11px; line-height: 1.4; overflow-x: auto; max-height: 240px; overflow-y: auto; }
      #diff .plus { color: #7aa35a; } #diff .moins { color: #e06c5a; } #diff .ctx { color: #948a76; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <h1>L'Atelier</h1>
        <div class="outil-groupe">
          <label><input type="radio" name="outil" value="peindre" checked />✏ peindre <kbd>B</kbd></label>
          <label><input type="radio" name="outil" value="gommer" />⌫ gommer <kbd>E</kbd></label>
          <label><input type="radio" name="outil" value="selection" />▦ sélection <kbd>M</kbd></label>
          <label><input type="radio" name="outil" value="breche" />◫ brèche</label>
          <label><input type="radio" name="outil" value="seuil" />◫ seuil</label>
          <label><input type="radio" name="outil" value="passage" />◫ passage</label>
        </div>
        <span class="sep"></span>
        <button id="annuler" title="Ctrl+Z">↶ annuler</button>
        <button id="refaire" title="Ctrl+Y">↷ refaire</button>
        <span class="sep"></span>
        <button id="miroir-h" title="miroir horizontal — sur la sélection, ou le collage armé">⇋ H</button>
        <button id="miroir-v" title="miroir vertical">⇅ V</button>
        <button id="tourner-frag" title="quart de tour horaire">⟳ 90°</button>
        <span class="sep"></span>
        <span id="zoom-v">100 %</span>
        <button id="recadrer" title="le plan entier dans la fenêtre">ajuster</button>
        <kbd>molette = zoom · Espace/milieu = pan · clic droit = gomme · Alt = pipette</kbd>
        <span class="sep"></span>
        <span class="calques">
          <label><input id="c-toits" type="checkbox" checked /> toits</label>
          <label><input id="c-aretes" type="checkbox" checked /> arêtes</label>
          <label><input id="c-regions" type="checkbox" /> régions</label>
          <label><input id="c-grille" type="checkbox" checked /> grille</label>
        </span>
        <span style="margin-left:auto"></span>
        <button id="aide-btn" title="la référence complète de l'éditeur (touche ?)">? aide</button>
      </div>

      <aside id="gauche">
        <h2>Le lieu</h2>
        <div class="rangee"><select id="lieux"></select></div>
        <div class="rangee">
          <button id="nouveau" title="un brouillon vierge, HORS-MONDE (plans/brouillons/)">+ nouveau</button>
          <button id="dupliquer" title="dupliquer le lieu courant en brouillon">⧉ dupliquer</button>
        </div>
        <h2>La palette <kbd>1…9, 0</kbd></h2>
        <div id="palette"></div>
        <h2>Tampons <kbd>Ctrl+C puis +</kbd></h2>
        <div id="tampons"></div>
        <div class="rangee"><button id="tampon-plus" title="mémoriser le presse-papier comme tampon nommé">+ tampon</button></div>
      </aside>

      <main id="centre"><div id="jeu"></div></main>

      <aside id="droite">
        <h2>Inspecteur</h2>
        <div class="rangee">
          <label>usure <input id="usure" type="number" min="0.05" max="1" step="0.05" style="width:64px" /></label>
          <label><input id="fixe" type="checkbox" /> fixe</label>
        </div>
        <div class="rangee">
          <label>sort <select id="sort"><option value="intact">intact</option><option value="pille">pillé</option><option value="brule">brûlé</option></select></label>
          <label>quart <select id="quart"><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
        </div>
        <div class="rangee">
          <label><input id="dedans" type="checkbox" /> avatar dedans</label>
        </div>
        <div class="rangee">
          <label>heure <input id="heure" type="range" min="0" max="23" step="1" value="12" style="width:110px" /> <span id="heure-v">12h</span></label>
        </div>
        <div class="rangee">
          empreinte
          <span class="redim">N <button data-redim="N" data-delta="1">+</button><button data-redim="N" data-delta="-1">−</button></span>
          <span class="redim">S <button data-redim="S" data-delta="1">+</button><button data-redim="S" data-delta="-1">−</button></span>
          <span class="redim">O <button data-redim="O" data-delta="1">+</button><button data-redim="O" data-delta="-1">−</button></span>
          <span class="redim">E <button data-redim="E" data-delta="1">+</button><button data-redim="E" data-delta="-1">−</button></span>
        </div>
        <h2>Validation</h2>
        <div id="validation"></div>
        <h2>La planche <span id="planche-cout" style="color:#948a76;font-size:10px"></span></h2>
        <div id="planche"></div>
        <div class="rangee">
          <button id="planche-maj">rafraîchir</button>
          <button id="exporter" title="la planche en PNG (vue + variantes)">PNG</button>
        </div>
        <h2>Historique</h2>
        <div class="rangee"><button id="historique-maj">charger l'historique git</button></div>
        <div id="historique"></div>
        <pre id="diff" style="display:none"></pre>
        <div class="rangee" style="margin-top:12px">
          <button id="sauver" class="principal">Sauver le .plan</button>
          <button id="copier">Copier</button>
        </div>
        <div id="etat"></div>
      </aside>

      <div id="aide"></div>
      <div id="statusbar">
        <span id="sb-pos"></span>
        <span id="sb-fautes" class="ok"></span>
        <span id="sb-modifie"></span>
        <button id="voir-diff" style="display:none">voir le diff</button>
        <span style="margin-left:auto"></span>
        <button id="tester" title="ouvre la Veillée dev et téléporte au premier exemplaire du lieu">▶ tester en jeu</button>
      </div>
    </div>
    <div id="aide-panneau" style="display:none"></div>
    <div id="infobulle"></div>
    <script type="module" src="/src/atelier/main.ts"></script>
  </body>
</html>
